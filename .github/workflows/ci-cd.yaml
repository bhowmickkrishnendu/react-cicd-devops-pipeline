name: CI/CD Pipeline

on:
  # push:
  #   branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: 18

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        working-directory: ./ui
        run: npm ci

      - name: Run Unit Tests with Coverage
        working-directory: ./ui
        run: |
          npm test -- --coverage --watchAll=false --collectCoverageFrom='src/**/*.{js,jsx}' --collectCoverageFrom='!src/index.js' --collectCoverageFrom='!src/reportWebVitals.js' --collectCoverageFrom='!src/setupTests.js'
        env:
          CI: true

      - name: Build UI
        working-directory: ./ui
        run: npm run build

      - name: Upload UI Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: ui/build
          if-no-files-found: error

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: SonarQube Scan
        if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
        uses: sonarsource/sonarqube-scan-action@v4.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-and-push:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.short-sha.outputs.SHORT_SHA }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download UI Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: ui/build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add short SHA to image tag
        id: short-sha
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Multi-Platform Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.short-sha.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.short-sha.outputs.SHORT_SHA }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve deployment target
        id: deploy-target
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)
              echo "DEPLOY_HOST=${{ secrets.DEV_HOST }}" >> "$GITHUB_OUTPUT"
              echo "DEPLOY_USER=${{ secrets.DEV_USER }}" >> "$GITHUB_OUTPUT"
              echo "APP_PORT=3000" >> "$GITHUB_OUTPUT"
              echo "ENV_LABEL=DEV" >> "$GITHUB_OUTPUT"
              ;;
            uat)
              echo "DEPLOY_HOST=${{ secrets.UAT_HOST }}" >> "$GITHUB_OUTPUT"
              echo "DEPLOY_USER=${{ secrets.UAT_USER }}" >> "$GITHUB_OUTPUT"
              echo "APP_PORT=3001" >> "$GITHUB_OUTPUT"
              echo "ENV_LABEL=UAT" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "DEPLOY_HOST=${{ secrets.PROD_HOST }}" >> "$GITHUB_OUTPUT"
              echo "DEPLOY_USER=${{ secrets.PROD_USER }}" >> "$GITHUB_OUTPUT"
              echo "APP_PORT=3002" >> "$GITHUB_OUTPUT"
              echo "ENV_LABEL=PROD" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Deploy to target server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.deploy-target.outputs.DEPLOY_HOST }}
          username: ${{ steps.deploy-target.outputs.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.short-sha }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin
            docker pull --platform linux/arm64/v8 "$IMAGE"
            docker stop reactapp 2>/dev/null || true
            docker rm reactapp 2>/dev/null || true
            docker run -d \
              --name reactapp \
              --restart unless-stopped \
              --platform linux/arm64/v8 \
              -p ${{ steps.deploy-target.outputs.APP_PORT }}:8080 \
              "$IMAGE"
            sleep 10
            curl -f "http://localhost:${{ steps.deploy-target.outputs.APP_PORT }}"

      - name: Slack Notify (Success)
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: "✅ SUCCESS: ${{ steps.deploy-target.outputs.ENV_LABEL }} deployment for *${{ github.ref_name }}* completed successfully. Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.short-sha }}"
          SLACK_COLOR: good

      - name: Slack Notify (Failure)
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: |
            ❌ *FAILED*: Deployment for *${{ github.ref_name }}* failed.
            Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_COLOR: danger
      
